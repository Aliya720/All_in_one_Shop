# This Nginx runs INSIDE the ecommerce Docker Compose stack. It serves the
# static frontend and reverse-proxies API/upload requests to the Go
# backend container over the internal Docker network. It is NOT the same
# as any Nginx already running on the host machine.
#
# The stack's only host-exposed port is controlled by APP_PORT in .env
# (see docker-compose.yml) and should be bound to 127.0.0.1 in
# production so this container is only reachable through the host's own
# Nginx (see nginx/shop.example.com.conf.example for that setup).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 10M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Static frontend assets.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy API requests to the Go backend service.
        location /api/ {
            proxy_pass http://backend:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy uploaded product images.
        location /uploads/ {
            proxy_pass http://backend:8080/uploads/;
            proxy_set_header Host $host;
        }

        location /healthz {
            proxy_pass http://backend:8080/healthz;
        }
    }
}
