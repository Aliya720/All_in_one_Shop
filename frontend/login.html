<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — ShopSphere</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container">
    <form class="card form-panel" id="login-form">
      <h2>Login</h2>
      <div id="alert-box"></div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn block">Login</button>
      <p class="muted" style="margin-top:14px; text-align:center;">
        No account? <a href="/register.html">Register</a>
      </p>
      <p class="muted" style="margin-top:6px; text-align:center; font-size:0.8rem;">
        Demo admin login is seeded from your .env (ADMIN_EMAIL / ADMIN_PASSWORD).
      </p>
    </form>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/auth-forms.js"></script>
</body>
</html>
