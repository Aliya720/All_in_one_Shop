<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — ShopSphere</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container">
    <form class="card form-panel" id="register-form">
      <h2>Create an account</h2>
      <div id="alert-box"></div>
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="8" autocomplete="new-password" />
        <span class="muted" style="font-size:0.8rem;">At least 8 characters.</span>
      </div>
      <button type="submit" class="btn block">Register</button>
      <p class="muted" style="margin-top:14px; text-align:center;">
        Already have an account? <a href="login.html">Login</a>
      </p>
    </form>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth-forms.js"></script>
</body>
</html>
