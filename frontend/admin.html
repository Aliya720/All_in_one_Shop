<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — ShopSphere</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container">
    <h1>Admin Dashboard</h1>
    <div id="alert-box"></div>

    <div class="stats-grid" id="stats-grid"></div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="products">Products</button>
      <button class="tab-btn" data-tab="categories">Categories</button>
      <button class="tab-btn" data-tab="orders">Orders</button>
      <button class="tab-btn" data-tab="users">Users</button>
    </div>

    <section id="tab-products" class="tab-panel">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h2 style="margin:0;">Products</h2>
        <button class="btn" id="new-product-btn">+ New Product</button>
      </div>
      <div class="card" style="padding:0; overflow-x:auto;">
        <table class="data-table" id="products-table">
          <thead>
            <tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Active</th><th>Actions</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section id="tab-categories" class="tab-panel" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h2 style="margin:0;">Categories</h2>
        <button class="btn" id="new-category-btn">+ New Category</button>
      </div>
      <div class="card" style="padding:0; overflow-x:auto;">
        <table class="data-table" id="categories-table">
          <thead><tr><th>Name</th><th>Slug</th><th>Description</th><th>Actions</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section id="tab-orders" class="tab-panel" style="display:none;">
      <h2>Orders</h2>
      <div class="card" style="padding:0; overflow-x:auto;">
        <table class="data-table" id="orders-table">
          <thead><tr><th>ID</th><th>User</th><th>Total</th><th>Status</th><th>Placed</th><th>Actions</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section id="tab-users" class="tab-panel" style="display:none;">
      <h2>Users</h2>
      <div class="card" style="padding:0; overflow-x:auto;">
        <table class="data-table" id="users-table">
          <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Joined</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Product editor modal (simple inline panel, not a true modal, for zero-dependency simplicity) -->
  <div id="product-modal" class="card" style="display:none; position:fixed; top:60px; left:50%; transform:translateX(-50%); width:min(520px, 90vw); padding:20px; z-index:100; max-height:80vh; overflow-y:auto;">
    <h3 id="product-modal-title">New Product</h3>
    <form id="product-form">
      <input type="hidden" id="product-id" />
      <div class="field"><label>Name</label><input type="text" id="p-name" required /></div>
      <div class="field"><label>Description</label><textarea id="p-description"></textarea></div>
      <div class="field"><label>Price</label><input type="number" id="p-price" min="0" step="0.01" required /></div>
      <div class="field"><label>Stock</label><input type="number" id="p-stock" min="0" required /></div>
      <div class="field"><label>SKU</label><input type="text" id="p-sku" /></div>
      <div class="field">
        <label>Category</label>
        <select id="p-category"><option value="">None</option></select>
      </div>
      <div class="field">
        <label><input type="checkbox" id="p-active" checked style="width:auto; display:inline-block; margin-right:6px;" /> Active</label>
      </div>
      <div class="field">
        <label>Image</label>
        <input type="file" id="p-image" accept="image/png,image/jpeg,image/webp,image/gif" />
      </div>
      <div style="display:flex; gap:10px;">
        <button type="submit" class="btn">Save</button>
        <button type="button" class="btn secondary" id="product-modal-cancel">Cancel</button>
      </div>
    </form>
  </div>

  <div id="category-modal" class="card" style="display:none; position:fixed; top:60px; left:50%; transform:translateX(-50%); width:min(420px, 90vw); padding:20px; z-index:100;">
    <h3 id="category-modal-title">New Category</h3>
    <form id="category-form">
      <input type="hidden" id="category-id" />
      <div class="field"><label>Name</label><input type="text" id="c-name" required /></div>
      <div class="field"><label>Description</label><textarea id="c-description"></textarea></div>
      <div style="display:flex; gap:10px;">
        <button type="submit" class="btn">Save</button>
        <button type="button" class="btn secondary" id="category-modal-cancel">Cancel</button>
      </div>
    </form>
  </div>

  <div id="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:90;"></div>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
