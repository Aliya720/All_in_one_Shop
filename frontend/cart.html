<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart — ShopSphere</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container">
    <h1>Your Cart</h1>
    <div id="alert-box"></div>

    <div class="grid" style="grid-template-columns: 2fr 1fr; gap: 24px; align-items:start;">
      <div class="card" style="padding: 16px;">
        <div id="cart-items"></div>
      </div>
      <div class="card" style="padding: 16px;">
        <h3>Order Summary</h3>
        <div class="summary-row">
          <span>Items</span><span id="summary-count">0</span>
        </div>
        <div class="summary-row total">
          <span>Total</span><span id="summary-total">₹0.00</span>
        </div>
        <a href="checkout.html" class="btn block" id="checkout-btn" style="margin-top:14px; text-align:center;">Proceed to Checkout</a>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
